# AI experts CRUD
iw_sulu_content_ai.get_experts:
    path: /iw-ai-experts.{_format}
    controller: ItechWorld\SuluContentAiBundle\Controller\Admin\AiExpertController::cgetAction
    methods: GET
    defaults: { _format: json }
    requirements: { _format: json }

iw_sulu_content_ai.get_expert:
    path: /iw-ai-experts/{id}.{_format}
    controller: ItechWorld\SuluContentAiBundle\Controller\Admin\AiExpertController::getAction
    methods: GET
    defaults: { _format: json }
    requirements: { _format: json }

iw_sulu_content_ai.post_expert:
    path: /iw-ai-experts.{_format}
    controller: ItechWorld\SuluContentAiBundle\Controller\Admin\AiExpertController::postAction
    methods: POST
    defaults: { _format: json }
    requirements: { _format: json }

iw_sulu_content_ai.put_expert:
    path: /iw-ai-experts/{id}.{_format}
    controller: ItechWorld\SuluContentAiBundle\Controller\Admin\AiExpertController::putAction
    methods: PUT
    defaults: { _format: json }
    requirements: { _format: json }

iw_sulu_content_ai.delete_expert:
    path: /iw-ai-experts/{id}.{_format}
    controller: ItechWorld\SuluContentAiBundle\Controller\Admin\AiExpertController::deleteAction
    methods: DELETE
    defaults: { _format: json }
    requirements: { _format: json }

